name: Cook self-test (soldr)

# Proves the default configuration rematerializes a real third-party closure.
#
# The sibling `cook-rematerialization` workflow drives a synthetic fixture and
# pins every input explicitly. This one does the opposite on purpose: it builds
# soldr itself -- a large real workspace -- and passes NO cook inputs, so what
# is under test is the shipped default. If `prebuild-deps` ever stops defaulting
# to soldr-cook, or cook gets gated off on a platform, the warm job here starts
# recompiling third-party crates and fails.
#
# Linux is the gate. Windows and macOS are assumed to work (cook has no
# platform gate in `decideCookGate`) but are runnable on demand via
# workflow_dispatch rather than being asserted by a green check nobody ran.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner to exercise (Linux is the only one run automatically)
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - windows-2022
          - macos-14
  pull_request:
    paths:
      - 'action.yml'
      - 'src/**'
      - 'dist/**'
      - '_vender/soldr'
      - '.github/workflows/cook-soldr-selftest.yml'
      - 'tests/cook-rematerialization/assert_no_external_rebuild.py'
  push:
    branches: [main]
    paths:
      - 'action.yml'
      - 'src/**'
      - 'dist/**'
      - '_vender/soldr'
      - '.github/workflows/cook-soldr-selftest.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Isolate this run's cache namespace so a rerun cannot be warmed by the
  # previous run's entries -- the warm job would then pass without the seed
  # job having produced anything.
  CACHE_GENERATION: cook-selftest-${{ github.run_id }}-${{ github.run_attempt }}
  # soldr's release profile uses codegen-units=1/LTO. Its cold cook exceeded
  # hosted-runner memory when a second compiler overlapped zccache-cli-core.
  CARGO_BUILD_JOBS: "1"
  SOLDR_JOBS: "1"

jobs:
  seed:
    name: Seed soldr dependency closure
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Repair yanked Soldr lock entry
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/scripts/repair-yanked-chacha20-lock.py" "$GITHUB_WORKSPACE/_vender/soldr/Cargo.lock"

      - id: setup
        name: Install soldr with shipped defaults
        uses: ./
        with:
          save-cache: "true"  # seed->warm jobs in one PR run must persist (#527)
          # Deliberately no prebuild-deps / prebuild-deps-delta-cache here.
          # The shipped defaults are the subject of this test.
          #
          # lockfile/target-dir ARE set, and are not a cook setting: this
          # repo is a TypeScript action with no Cargo.lock at its root, so
          # the default lockfile path does not resolve and cook correctly
          # skips ("cook: skipped - Cargo.lock path Cargo.lock does not
          # exist"). Pointing the action at the Rust project is context the
          # defaults need in order to apply at all.
          # No source-path: the shipped default installs a RELEASED soldr.
          # Building soldr from source here would put the source build's
          # target/ in the same directory cook is caching, and that
          # self-reference makes the cook layer restore an exact key match
          # with a 0-byte archive, then silently fall back to a full
          # re-cook. The mainstream path is a released binary cooking a
          # separate project, so that is what this tests.
          lockfile: _vender/soldr/Cargo.lock
          target-dir: _vender/soldr/target
          toolchain: 1.95.0
          cache-key-suffix: ${{ env.CACHE_GENERATION }}

      - name: Require cook to be active by default
        shell: bash
        env:
          COOK_STATUS: ${{ steps.setup.outputs.cook-cache-status }}
        run: |
          set -euo pipefail
          echo "cook-cache-status=$COOK_STATUS"
          if [ "$COOK_STATUS" = "disabled" ]; then
            echo "::error::cook is disabled under shipped defaults on ${{ runner.os }}. \
          Check the setup step's 'cook: skipped - <reason>' line: a missing \
          Cargo.lock means this workflow is misconfigured; anything else \
          means the default regressed, which is what this exists to catch."
            exit 1
          fi

      - name: Build soldr so the closure is populated
        shell: bash
        working-directory: _vender/soldr
        run: soldr cargo build -p soldr-cli --locked

  warm:
    name: Rematerialize soldr dependency closure
    needs: seed
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Repair yanked Soldr lock entry
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/scripts/repair-yanked-chacha20-lock.py" "$GITHUB_WORKSPACE/_vender/soldr/Cargo.lock"

      - id: setup
        name: Install soldr with shipped defaults
        uses: ./
        with:
          save-cache: "true"  # seed->warm jobs in one PR run must persist (#527)
          lockfile: _vender/soldr/Cargo.lock
          target-dir: _vender/soldr/target
          toolchain: 1.95.0
          cache-key-suffix: ${{ env.CACHE_GENERATION }}

      - name: Require the dependency closure to have been restored
        shell: bash
        env:
          COOK_HIT: ${{ steps.setup.outputs.cook-cache-hit }}
          COOK_STATUS: ${{ steps.setup.outputs.cook-cache-status }}
        run: |
          set -euo pipefail
          echo "cook-cache-hit=$COOK_HIT cook-cache-status=$COOK_STATUS"
          if [ "$COOK_HIT" != "true" ]; then
            echo "::error::warm job did not restore the cook closure the seed job saved; \
          without a restore the freshness assertion below proves nothing"
            exit 1
          fi

      - id: build
        name: Prove no third-party code rebuilds
        shell: bash
        working-directory: _vender/soldr
        run: |
          set -euo pipefail
          # Force one first-party unit dirty. The closure itself must remain
          # fresh; otherwise a zero-work Cargo invocation would prove nothing.
          touch crates/soldr-cli/src/main.rs
          soldr cargo metadata --locked --format-version=1 \
            > "$RUNNER_TEMP/warm-metadata.json"
          soldr cargo build -p soldr-cli --locked \
            --message-format=json-render-diagnostics \
            > "$RUNNER_TEMP/warm-messages.jsonl" \
            2> "$RUNNER_TEMP/warm-stderr.log"
          python "$GITHUB_WORKSPACE/tests/cook-rematerialization/assert_no_external_rebuild.py" \
            "$RUNNER_TEMP/warm-messages.jsonl" \
            "$RUNNER_TEMP/warm-report.json" \
            200 \
            "$RUNNER_TEMP/warm-metadata.json"

      - name: Upload rematerialization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cook-selftest-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/warm-report.json
            ${{ runner.temp }}/warm-stderr.log
            ${{ runner.temp }}/warm-metadata.json
          if-no-files-found: warn
          retention-days: 7

  # #513 P0: every cache this run saves is keyed under CACHE_GENERATION
  # (run_id + run_attempt), so it is unreachable the moment the run ends.
  # Delete that exact namespace as the final job — on success, failure, and
  # cancellation — so validation runs stop consuming the repository's cache
  # quota forever. The deleter refuses any namespace that does not embed
  # this run's id, so it cannot touch shared or consumer-owned entries.
  cleanup:
    name: Delete run-scoped cache keys
    needs: [seed, warm]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Delete this run's namespaced cache keys
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/delete-run-scoped-caches.mjs"
