name: Ingest soldr release

# Keeps the vendor-locked default soldr (src/lib/default-soldr-version.ts +
# action.yml inputs.version.default) current. Polls for a new soldr release
# through the github.com/<repo>/releases/latest web redirect (no REST quota),
# bumps the default, rebuilds dist/, and opens a PR. Merging that PR and then
# moving v0 still follow the gated update-v0-tag.yml process.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Exact soldr version to ingest (empty = latest release).
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ingest-soldr-release
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve target soldr release
        id: target
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED#v}"
          if [[ -z "$version" ]]; then
            location="$(curl -fsSI https://github.com/forge-ci/soldr/releases/latest | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')"
            version="${location##*/releases/tag/v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version '$version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Bump default
        id: bump
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          result="$(node scripts/bump-default-soldr.mjs "$VERSION")"
          echo "$result"
          if [[ "$result" == unchanged ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild dist and open PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          branch="chore/default-soldr-${VERSION}"
          title="chore: default soldr ${VERSION}"
          if git ls-remote --exit-code origin "refs/heads/${branch}" >/dev/null; then
            open="$(gh pr list --head "${branch}" --state all --json number --jq 'length')"
            if [[ "${open}" != "0" ]]; then
              echo "PR for ${branch} already exists"
              exit 0
            fi
            echo "branch ${branch} exists without a PR; retrying PR creation"
          else
            npm ci
            npm run build
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "${branch}"
            git add -A src/lib/default-soldr-version.ts action.yml README.md tests/test_action_target_cache_wiring.py dist
            git commit -m "${title}"
            git push origin "${branch}"
          fi
          if ! out="$(gh pr create --base main --head "${branch}" --title "${title}" \
            --body "Automated by ingest-soldr-release.yml: moves the vendor-locked default soldr to ${VERSION} and rebuilds dist/. After merge, promote v0 through update-v0-tag.yml." 2>&1)"; then
            echo "${out}"
            if grep -q "not permitted to create or approve pull requests" <<<"${out}"; then
              echo "::error title=GITHUB_TOKEN cannot create PRs::Branch ${branch} was pushed but PR creation was refused. Enable 'Allow GitHub Actions to create and approve pull requests' (can_approve_pull_request_reviews=true) at Settings > Actions > General for the forge-ci org AND this repo. The next scheduled run will retry PR creation for the existing branch."
            fi
            exit 1
          fi
          echo "${out}"
