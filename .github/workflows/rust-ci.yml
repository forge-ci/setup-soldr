# Reusable Rust CI workflow for repos that consume setup-soldr.
#
# Pattern: warm-then-fan-out. The `warm` job runs setup-soldr and a
# `soldr cargo build --workspace --all-targets`, populating the
# build/target/registry caches. Per-tool jobs (`fmt`, `lint`, `clippy`,
# `test`, `dylint`) then each re-run setup-soldr (same SHA -> same
# cache key, so the restore is a hot hit) and execute their respective
# `soldr cargo ...` invocation. Each Rust job writes a CI-owned
# rust-toolchain file and passes it to setup-soldr so targets/components are
# provisioned through setup-soldr's supported toolchain-file path. Per-tool
# jobs are individually toggleable via boolean inputs.
#
# The default compile mode is cross-compilation. On ubuntu-latest this
# builds and tests x86_64-unknown-linux-musl unless the caller selects
# `compile-mode: native` or overrides `target`.
#
# Usage:
#
#   jobs:
#     ci:
#       uses: zackees/setup-soldr/.github/workflows/rust-ci.yml@v0
#       with:
#         os: ubuntu-latest
#
# See README.md "Reusable Rust CI workflow" for the full input table,
# native opt-in example, and cross-compile matrix example.

name: rust-ci (reusable)

on:
  workflow_call:
    inputs:
      os:
        description: Runner label (e.g. ubuntu-latest, macos-latest, windows-latest).
        type: string
        required: false
        default: ubuntu-latest
      compile-mode:
        description: Compilation mode. Accepted values are "cross" (default) and "native".
        type: string
        required: false
        default: cross
      target:
        description: >
          Rust target triple used when compile-mode is "cross". The default
          x86_64-unknown-linux-musl gives ubuntu-latest a real non-host target
          that can still run tests. Ignored when compile-mode is "native".
        type: string
        required: false
        default: x86_64-unknown-linux-musl
      working-directory:
        description: Directory containing the Rust workspace or package to check.
        type: string
        required: false
        default: "."
      toolchain:
        description: >
          Channel written into rust-toolchain.rust-ci.toml. Empty (default)
          uses the channel from rust-toolchain.toml when present and otherwise
          falls back to stable.
        type: string
        required: false
        default: ""
      features:
        description: Forwarded as `--features <value>` on the warm build.
        type: string
        required: false
        default: ""
      cargo-args:
        description: Free-form extra args appended to the warm `soldr cargo build` invocation.
        type: string
        required: false
        default: ""
      cache:
        description: Forwarded to setup-soldr's `cache` umbrella input.
        type: boolean
        required: false
        default: true
      lint:
        description: When true, runs `cargo check --workspace --all-targets`.
        type: boolean
        required: false
        default: true
      fmt:
        description: When true, runs `cargo fmt --all -- --check`.
        type: boolean
        required: false
        default: true
      clippy:
        description: When true, runs `cargo clippy --workspace --all-targets -- -D warnings`.
        type: boolean
        required: false
        default: true
      test:
        description: When true, runs `cargo test --workspace`.
        type: boolean
        required: false
        default: true
      dylint:
        description: >
          When true, asks setup-soldr/Soldr to prepare the pinned Dylint stack and runs
          `cargo dylint --all --workspace`. Opt-in because dylint requires
          consumer-provided `dylint.toml` + driver crates.
        type: boolean
        required: false
        default: false
      cargo-dylint-version:
        description: Exact cargo-dylint version installed by the Dylint job.
        type: string
        required: false
        default: "6.2.0"
      dylint-link-version:
        description: Exact dylint-link version installed by the Dylint job.
        type: string
        required: false
        default: "6.2.0"
  workflow_dispatch:
    inputs:
      ancestor-pilot:
        description: Explicit bounded mechanics experiment; off preserves normal Rust CI.
        type: choice
        default: "off"
        options:
          - "off"
          - seed-legacy
          - seed-auto
          - legacy
          - auto
      ancestor-trusted-writers:
        description: Reviewed immutable main writer policy for the auto comparison only.
        type: string
        default: ""
      os:
        description: Runner label.
        type: string
        required: false
        default: ubuntu-latest
      compile-mode:
        description: Compilation mode.
        type: choice
        required: false
        default: cross
        options:
          - cross
          - native
      target:
        description: Rust target triple used when compile-mode is cross.
        type: string
        required: false
        default: x86_64-unknown-linux-musl
      working-directory:
        description: Directory containing the Rust workspace or package to check.
        type: string
        required: false
        default: scripts/bench-workloads/demo-small
      toolchain:
        description: Rust channel written into rust-toolchain.rust-ci.toml.
        type: string
        required: false
        default: ""
      features:
        description: Features forwarded to the warm build.
        type: string
        required: false
        default: ""
      cargo-args:
        description: Extra args appended to the warm build.
        type: string
        required: false
        default: ""
      cache:
        description: Forward setup-soldr cache switch.
        type: boolean
        required: false
        default: true
      lint:
        description: Run cargo check.
        type: boolean
        required: false
        default: true
      fmt:
        description: Run cargo fmt --check.
        type: boolean
        required: false
        default: true
      clippy:
        description: Run cargo clippy.
        type: boolean
        required: false
        default: true
      test:
        description: Run cargo test.
        type: boolean
        required: false
        default: true
      dylint:
        description: Run cargo dylint.
        type: boolean
        required: false
        default: false

      cargo-dylint-version:
        description: Exact cargo-dylint version installed by the Dylint job.
        type: string
        required: false
        default: "6.2.0"
      dylint-link-version:
        description: Exact dylint-link version installed by the Dylint job.
        type: string
        required: false
        default: "6.2.0"

jobs:
  warm:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.ancestor-pilot || inputs.ancestor-pilot == 'off' }}
    name: warm (build)
    runs-on: ${{ inputs.os }}
    outputs:
      target: ${{ steps.mode.outputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve compilation mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          mode="${{ inputs.compile-mode }}"
          target="${{ inputs.target }}"
          if [ -z "$mode" ]; then
            mode="cross"
          fi
          case "$mode" in
            cross)
              if [ -z "$target" ]; then
                target="x86_64-unknown-linux-musl"
              fi
              echo "target=$target" >> "$GITHUB_OUTPUT"
              ;;
            native)
              echo "target=" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error title=Invalid compile-mode::compile-mode must be 'cross' or 'native' (got '$mode')"
              exit 1
              ;;
          esac

      - name: Write rust-ci toolchain spec
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          path="rust-toolchain.rust-ci.toml"
          channel="${{ inputs.toolchain }}"
          if [ -z "$channel" ]; then
            channel="stable"
            if [ -f rust-toolchain.toml ]; then
              parsed="$(sed -n -E 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' rust-toolchain.toml | head -n 1)"
              if [ -n "$parsed" ]; then
                channel="$parsed"
              fi
            fi
          fi
          target="${{ steps.mode.outputs.target }}"
          components=()
          if [ "${{ inputs.fmt }}" = "true" ]; then
            components+=(rustfmt)
          fi
          if [ "${{ inputs.clippy }}" = "true" ]; then
            components+=(clippy)
          fi
          {
            echo "[toolchain]"
            printf 'channel = "%s"\n' "$channel"
            echo 'profile = "minimal"'
            if [ "${#components[@]}" -gt 0 ]; then
              printf 'components = ['
              sep=""
              for component in "${components[@]}"; do
                printf '%s"%s"' "$sep" "$component"
                sep=", "
              done
              printf ']\n'
            fi
            if [ -n "$target" ]; then
              printf 'targets = ["%s"]\n' "$target"
            fi
          } > "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          sed 's/^/  /' "$path"

      - name: Setup soldr
        uses: zackees/setup-soldr@v0
        with:
          toolchain-file: ${{ steps.toolchain.outputs.path }}
          cross-targets: ${{ steps.mode.outputs.target }}
          cache: ${{ inputs.cache }}

      - name: Warm build (workspace, all-targets)
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          args=(--workspace --all-targets)
          target="${{ steps.mode.outputs.target }}"
          if [ -n "$target" ]; then
            args+=(--target "$target")
          fi
          if [ -n "${{ inputs.features }}" ]; then
            args+=(--features "${{ inputs.features }}")
          fi
          # shellcheck disable=SC2206 # intentional word-split on cargo-args
          extra=(${{ inputs.cargo-args }})
          soldr build "${args[@]}" "${extra[@]}"

  fmt:
    name: fmt
    needs: warm
    if: ${{ inputs.fmt }}
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write rust-ci toolchain spec
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          path="rust-toolchain.rust-ci.toml"
          channel="${{ inputs.toolchain }}"
          if [ -z "$channel" ]; then
            channel="stable"
            if [ -f rust-toolchain.toml ]; then
              parsed="$(sed -n -E 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' rust-toolchain.toml | head -n 1)"
              if [ -n "$parsed" ]; then
                channel="$parsed"
              fi
            fi
          fi
          target="${{ needs.warm.outputs.target }}"
          components=()
          if [ "${{ inputs.fmt }}" = "true" ]; then
            components+=(rustfmt)
          fi
          if [ "${{ inputs.clippy }}" = "true" ]; then
            components+=(clippy)
          fi
          {
            echo "[toolchain]"
            printf 'channel = "%s"\n' "$channel"
            echo 'profile = "minimal"'
            if [ "${#components[@]}" -gt 0 ]; then
              printf 'components = ['
              sep=""
              for component in "${components[@]}"; do
                printf '%s"%s"' "$sep" "$component"
                sep=", "
              done
              printf ']\n'
            fi
            if [ -n "$target" ]; then
              printf 'targets = ["%s"]\n' "$target"
            fi
          } > "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          sed 's/^/  /' "$path"

      - name: Setup soldr
        uses: zackees/setup-soldr@v0
        with:
          toolchain-file: ${{ steps.toolchain.outputs.path }}
          cross-targets: ${{ needs.warm.outputs.target }}
          cache: ${{ inputs.cache }}

      - name: cargo fmt --check
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: soldr cargo fmt --all -- --check

  lint:
    name: lint (cargo check)
    needs: warm
    if: ${{ inputs.lint }}
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write rust-ci toolchain spec
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          path="rust-toolchain.rust-ci.toml"
          channel="${{ inputs.toolchain }}"
          if [ -z "$channel" ]; then
            channel="stable"
            if [ -f rust-toolchain.toml ]; then
              parsed="$(sed -n -E 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' rust-toolchain.toml | head -n 1)"
              if [ -n "$parsed" ]; then
                channel="$parsed"
              fi
            fi
          fi
          target="${{ needs.warm.outputs.target }}"
          components=()
          if [ "${{ inputs.fmt }}" = "true" ]; then
            components+=(rustfmt)
          fi
          if [ "${{ inputs.clippy }}" = "true" ]; then
            components+=(clippy)
          fi
          {
            echo "[toolchain]"
            printf 'channel = "%s"\n' "$channel"
            echo 'profile = "minimal"'
            if [ "${#components[@]}" -gt 0 ]; then
              printf 'components = ['
              sep=""
              for component in "${components[@]}"; do
                printf '%s"%s"' "$sep" "$component"
                sep=", "
              done
              printf ']\n'
            fi
            if [ -n "$target" ]; then
              printf 'targets = ["%s"]\n' "$target"
            fi
          } > "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          sed 's/^/  /' "$path"

      - name: Setup soldr
        uses: zackees/setup-soldr@v0
        with:
          toolchain-file: ${{ steps.toolchain.outputs.path }}
          cross-targets: ${{ needs.warm.outputs.target }}
          cache: ${{ inputs.cache }}

      - name: cargo check
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          args=(--workspace --all-targets)
          target="${{ needs.warm.outputs.target }}"
          if [ -n "$target" ]; then
            args+=(--target "$target")
          fi
          soldr cargo check "${args[@]}"

  clippy:
    name: clippy
    needs: warm
    if: ${{ inputs.clippy }}
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write rust-ci toolchain spec
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          path="rust-toolchain.rust-ci.toml"
          channel="${{ inputs.toolchain }}"
          if [ -z "$channel" ]; then
            channel="stable"
            if [ -f rust-toolchain.toml ]; then
              parsed="$(sed -n -E 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' rust-toolchain.toml | head -n 1)"
              if [ -n "$parsed" ]; then
                channel="$parsed"
              fi
            fi
          fi
          target="${{ needs.warm.outputs.target }}"
          components=()
          if [ "${{ inputs.fmt }}" = "true" ]; then
            components+=(rustfmt)
          fi
          if [ "${{ inputs.clippy }}" = "true" ]; then
            components+=(clippy)
          fi
          {
            echo "[toolchain]"
            printf 'channel = "%s"\n' "$channel"
            echo 'profile = "minimal"'
            if [ "${#components[@]}" -gt 0 ]; then
              printf 'components = ['
              sep=""
              for component in "${components[@]}"; do
                printf '%s"%s"' "$sep" "$component"
                sep=", "
              done
              printf ']\n'
            fi
            if [ -n "$target" ]; then
              printf 'targets = ["%s"]\n' "$target"
            fi
          } > "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          sed 's/^/  /' "$path"

      - name: Setup soldr
        uses: zackees/setup-soldr@v0
        with:
          toolchain-file: ${{ steps.toolchain.outputs.path }}
          cross-targets: ${{ needs.warm.outputs.target }}
          cache: ${{ inputs.cache }}

      - name: cargo clippy
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          args=(--workspace --all-targets)
          target="${{ needs.warm.outputs.target }}"
          if [ -n "$target" ]; then
            args+=(--target "$target")
          fi
          soldr cargo clippy "${args[@]}" -- -D warnings

  test:
    name: test
    needs: warm
    if: ${{ inputs.test }}
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write rust-ci toolchain spec
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          path="rust-toolchain.rust-ci.toml"
          channel="${{ inputs.toolchain }}"
          if [ -z "$channel" ]; then
            channel="stable"
            if [ -f rust-toolchain.toml ]; then
              parsed="$(sed -n -E 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' rust-toolchain.toml | head -n 1)"
              if [ -n "$parsed" ]; then
                channel="$parsed"
              fi
            fi
          fi
          target="${{ needs.warm.outputs.target }}"
          components=()
          if [ "${{ inputs.fmt }}" = "true" ]; then
            components+=(rustfmt)
          fi
          if [ "${{ inputs.clippy }}" = "true" ]; then
            components+=(clippy)
          fi
          {
            echo "[toolchain]"
            printf 'channel = "%s"\n' "$channel"
            echo 'profile = "minimal"'
            if [ "${#components[@]}" -gt 0 ]; then
              printf 'components = ['
              sep=""
              for component in "${components[@]}"; do
                printf '%s"%s"' "$sep" "$component"
                sep=", "
              done
              printf ']\n'
            fi
            if [ -n "$target" ]; then
              printf 'targets = ["%s"]\n' "$target"
            fi
          } > "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          sed 's/^/  /' "$path"

      - name: Setup soldr
        uses: zackees/setup-soldr@v0
        with:
          toolchain-file: ${{ steps.toolchain.outputs.path }}
          cross-targets: ${{ needs.warm.outputs.target }}
          cache: ${{ inputs.cache }}

      - name: cargo test
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          args=(--workspace)
          target="${{ needs.warm.outputs.target }}"
          if [ -n "$target" ]; then
            args+=(--target "$target")
          fi
          soldr cargo test "${args[@]}"

  dylint:
    name: dylint
    needs: warm
    if: ${{ inputs.dylint }}
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup soldr
        id: setup
        uses: zackees/setup-soldr@v0
        with:
          toolchain: ${{ inputs.toolchain }}
          cache: ${{ inputs.cache }}
          dylint: true
          cargo-dylint-version: ${{ inputs.cargo-dylint-version }}
          dylint-link-version: ${{ inputs.dylint-link-version }}

      - name: cargo dylint
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: soldr cargo dylint --all --workspace

  ancestor-pilot:
    name: ancestor mechanics (native Linux)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ancestor-pilot && inputs.ancestor-pilot != 'off' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      PILOT_MODE: ${{ inputs.ancestor-pilot }}
      PILOT_TRUSTED_WRITERS: ${{ inputs.ancestor-trusted-writers }}
    steps:
      - name: Checkout immutable experiment source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 200
          persist-credentials: false
      - name: Prepare declared action runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Validate pilot source and save policy
        id: pilot
        run: python3 scripts/ancestor_cache_pilot.py validate
      - name: Setup pilot cache
        id: cache
        uses: zackees/setup-soldr@f737b734d69e7f009f1c611320a053447943616e
        with:
          version: "0.9.28"
          toolchain: "1.98.1"
          cache: "true"
          build-cache: "true"
          build-cache-mode: full
          target-cache: "false"
          prebuild-deps: none
          cache-key-suffix: ${{ steps.pilot.outputs.namespace }}
          key: ${{ steps.pilot.outputs.key }}
          auto-key-trusted-writers: ${{ inputs.ancestor-trusted-writers }}
          save-cache: ${{ steps.pilot.outputs.save }}
          job-status: ${{ job.status }}
          save-on-failure: "false"
          build-cache-save-min-compiles: "0"
          cache-payload-max-bytes: "209715200"
          cache-payload-oversize-action: skip
          lockfile: scripts/bench-workloads/demo-small/Cargo.lock
          target-dir: scripts/bench-workloads/demo-small/target
      - name: Measure actual build and usable restore
        env:
          PILOT_WRITE_KEY: ${{ steps.cache.outputs.build-cache-key }}
          PILOT_MATCHED_KEY: ${{ steps.cache.outputs.build-cache-matched-key }}
          PILOT_ANCESTOR_JSON: ${{ steps.cache.outputs.build-cache-ancestor-json }}
          PILOT_BUILD_CACHE_PATH: ${{ steps.cache.outputs.build-cache-path }}
        run: python3 scripts/ancestor_cache_pilot.py measure
      - name: Preserve bounded experiment report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ancestor-pilot-${{ inputs.ancestor-pilot }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ancestor-pilot/
          if-no-files-found: ignore
          retention-days: 14
