name: Setup Soldr Action

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - README.md
      - action.yml
      - src/**
      - dist/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/setup-soldr-action.yml
  workflow_dispatch:

# One live run per workflow per ref: a new push to a branch or PR cancels the
# superseded run instead of queuing behind it in the shared account-wide runner
# pool. Runs on main get a unique group, so they are never cancelled or coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  install-smoke:
    name: Install soldr smoke
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout setup-soldr action
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: setup-soldr

      - id: setup
        name: Setup Soldr
        uses: ./setup-soldr
        with:
          cache: true
          # #559: the post step skips build-output saves when the job failed.
          job-status: ${{ job.status }}

      - name: Show action outputs
        shell: pwsh
        run: |
          if ("${{ steps.setup.outputs.build-cache-hit }}" -eq "true" -or $env:SOLDR_BUILD_CACHE_MODE -ne "off") {
            throw "dependency build cache must be disabled without Cargo.lock"
          }
          Write-Host "soldr-path=${{ steps.setup.outputs.soldr-path }}"
          Write-Host "soldr-version=${{ steps.setup.outputs.soldr-version }}"
          Write-Host "cache-dir=${{ steps.setup.outputs.cache-dir }}"
          Write-Host "cache-hit=${{ steps.setup.outputs.cache-hit }}"
          Write-Host "cache-key=${{ steps.setup.outputs.cache-key }}"
          Write-Host "cache-restore-status=${{ steps.setup.outputs.cache-restore-status }}"
          Write-Host "build-cache-hit=${{ steps.setup.outputs.build-cache-hit }}"
          Write-Host "build-cache-key=${{ steps.setup.outputs.build-cache-key }}"
          Write-Host "build-cache-path=${{ steps.setup.outputs.build-cache-path }}"
          Write-Host "build-cache-mode=${{ steps.setup.outputs.build-cache-mode }}"
          Write-Host "build-cache-restore-status=${{ steps.setup.outputs.build-cache-restore-status }}"
          Write-Host "target-cache-hit=${{ steps.setup.outputs.target-cache-hit }}"
          Write-Host "target-cache-key=${{ steps.setup.outputs.target-cache-key }}"
          Write-Host "target-cache-path=${{ steps.setup.outputs.target-cache-path }}"
          Write-Host "target-cache-paths=${{ steps.setup.outputs.target-cache-paths }}"
          Write-Host "target-cache-mode=${{ steps.setup.outputs.target-cache-mode }}"
          Write-Host "target-cache-restore-status=${{ steps.setup.outputs.target-cache-restore-status }}"
          Write-Host "target-lockfile=${{ steps.setup.outputs.target-lockfile }}"
          Write-Host "target-lockfile-hash=${{ steps.setup.outputs.target-lockfile-hash }}"
          Write-Host "toolchain=${{ steps.setup.outputs.toolchain }}"

      - name: Verify embedded zccache survives isolated SOLDR_CACHE_DIR
        shell: bash
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/setup-soldr-zccache-seed-smoke
        run: |
          set -euo pipefail
          doctor_json="$(soldr doctor --json)"
          printf '%s\n' "$doctor_json"
          node -e '
            const payload = JSON.parse(process.argv[1]);
            if (payload.zccache?.backend !== "embedded") {
              console.error(
                `expected embedded zccache after SOLDR_CACHE_DIR override; got ${JSON.stringify(payload.zccache)}`,
              );
              process.exit(1);
            }
          ' "$doctor_json"

  # Regression for the talos-vox macOS clippy break: a workflow installs Rust
  # with clippy into the runner toolchain, then setup-soldr forces a private
  # RUSTUP_HOME on macOS (#105). The managed toolchain must carry clippy and
  # rustfmt itself, so `soldr cargo clippy` never falls back to a first-use
  # `rustup component add` after the solo-toolchain snapshot was taken.
  macos-runner-components:
    name: macOS managed toolchain keeps runner components
    runs-on: macos-latest
    steps:
      - name: Checkout setup-soldr action
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: setup-soldr

      - name: Install Rust with clippy into the runner toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Create probe crate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/probe/src"
          printf '[package]\nname = "probe"\nversion = "0.1.0"\nedition = "2021"\n\n[workspace]\n' > "$GITHUB_WORKSPACE/probe/Cargo.toml"
          printf 'pub fn add(a: u32, b: u32) -> u32 {\n    a + b\n}\n' > "$GITHUB_WORKSPACE/probe/src/lib.rs"

      - id: setup
        name: Setup Soldr
        uses: ./setup-soldr
        with:
          prebuild-deps: none
          job-status: ${{ job.status }}

      - name: Managed toolchain carries clippy and rustfmt
        shell: bash
        run: |
          set -euo pipefail
          echo "RUSTUP_HOME=$RUSTUP_HOME components=$SETUP_SOLDR_TOOLCHAIN_COMPONENTS"
          case "$RUSTUP_HOME" in
            "$HOME/.rustup") echo "::error::expected the macOS managed RUSTUP_HOME (#105)"; exit 1 ;;
          esac
          rustup which cargo-clippy
          rustup which rustfmt
          # Every component rustup registered must have its files on disk.
          sysroot="$(dirname "$(dirname "$(rustup which rustc)")")"
          while read -r component; do
            manifest="$sysroot/lib/rustlib/manifest-$component"
            test -f "$manifest" || { echo "::error::$component registered without $manifest"; exit 1; }
            while IFS=: read -r kind rel; do
              test -e "$sysroot/$rel" || { echo "::error::$component is missing $rel"; exit 1; }
            done < "$manifest"
          done < "$sysroot/lib/rustlib/components"

      - name: soldr cargo clippy and fmt use the carried components
        shell: bash
        working-directory: probe
        run: |
          set -euo pipefail
          soldr cargo clippy -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
          soldr cargo fmt --check 2>&1 | tee "$RUNNER_TEMP/fmt.log"
          if grep -q "first-use bootstrap" "$RUNNER_TEMP/clippy.log" "$RUNNER_TEMP/fmt.log"; then
            echo "::error::soldr had to install a component the runner toolchain already had"
            exit 1
          fi
