name: Setup Soldr Contract

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - action.yml
      - src/**
      - dist/**
      - _vender/soldr
      - .gitmodules
      - __tests__/**
      - scripts/*bench*.mjs
      - scripts/bench-workloads/**
      - scripts/check-default-release-readiness.mjs
      - scripts/write-release-metadata.mjs
      - scripts/resolve-release-artifacts.py
      - tests/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/setup-soldr-action.yml
      - .github/workflows/bench-cache-modes.yml
      - .github/workflows/rust-ci.yml
      - .github/workflows/release-lane.yml
      - .github/workflows/release-lane-smoke.yml
      - .github/workflows/cook-rematerialization.yml
      - .github/workflows/setup-soldr-contract.yml
      - .github/workflows/update-v0-tag.yml
  pull_request:
    paths:
      - README.md
      - action.yml
      - src/**
      - dist/**
      - _vender/soldr
      - .gitmodules
      - __tests__/**
      - scripts/*bench*.mjs
      - scripts/bench-workloads/**
      - scripts/check-default-release-readiness.mjs
      - scripts/write-release-metadata.mjs
      - scripts/resolve-release-artifacts.py
      - tests/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/setup-soldr-action.yml
      - .github/workflows/bench-cache-modes.yml
      - .github/workflows/rust-ci.yml
      - .github/workflows/release-lane.yml
      - .github/workflows/release-lane-smoke.yml
      - .github/workflows/cook-rematerialization.yml
      - .github/workflows/setup-soldr-contract.yml
      - .github/workflows/update-v0-tag.yml
  # GEN-022 (forge-ci/ci.yml#405/#432): PRs merge through the main merge queue.
  # merge_group takes no `paths:` filter, so every queue entry runs this workflow.
  merge_group:
  workflow_dispatch:

# One live run per workflow per ref: a new push to a branch or PR cancels the
# superseded run instead of queuing behind it in the shared account-wide runner
# pool. Runs on main get a unique group, so they are never cancelled or coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # GEN-022 / forge-ci/ci.yml#409: a queue ref carries the base commit
  # (gh-readonly-queue/main/pr-<N>-<sha>), so the workflow concurrency group
  # never pairs a PR's rebuilt queue run with the one main's movement replaced;
  # this cancels the older one. No `needs:`; only the end-of-queue janitor
  # depends on it.
  cancel-superseded:
    name: Cancel superseded queue runs
    if: ${{ !cancelled() && github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: ci/cancel_superseded.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Cancel
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/cancel_superseded.py

  js-build:
    name: JS Build and Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 matches the action runtime declared in action.yml and
          # supports `--experimental-strip-types` for the TypeScript tests.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build dist bundles
        run: npm run build

      - name: Verify dist/ entrypoints are up to date
        run: |
          set -euo pipefail
          # #306: verify ONLY the entry-point bundles (dist/main.js,
          # dist/post.js, cleanup/dist/index.js). Side chunks
          # (dist/<id>.index.js) are intentionally not byte-verified
          # — webpack module-discovery ordering inside a chunk is
          # non-deterministic across host filesystems (Docker mounted
          # volumes vs. CI runner ext4 vs. NTFS), making the chunk
          # files byte-different even with identical inputs.
          #
          # The entry-point bundles ARE normalized deterministically
          # by scripts/bundle-entrypoint.mjs (CRLF→LF, sortWebpackModules
          # when no chunks), so verifying them catches the case
          # "maintainer forgot to run npm run build."
          #
          # Maintainer guidance: when modifying src/, ALWAYS run
          # `npm run build` and commit BOTH the entry-point bundles
          # AND the side chunks together. The side chunks won't be
          # verified by CI but MUST be present for the action to load.
          PATHS_TO_VERIFY=(
            "dist/main.js"
            "dist/post.js"
            "cleanup/dist/index.js"
          )
          if ! git diff --exit-code -- "${PATHS_TO_VERIFY[@]}"; then
            echo "::error::Entry-point dist/ is out of date. Run 'npm run build' and commit dist/main.js, dist/post.js, cleanup/dist/index.js (and any side chunks dist/<id>.index.js)." >&2
            exit 1
          fi
          # Sanity check: side chunks referenced by main bundles must exist on disk.
          for f in dist/main.js dist/post.js; do
            for chunk_id in $(grep -oE 'require\("\./([0-9]+)\.index\.js"' "$f" | grep -oE '[0-9]+' | sort -u); do
              if [ ! -f "dist/${chunk_id}.index.js" ]; then
                echo "::error::dist/main.js references chunk ${chunk_id}.index.js but the file is missing from dist/" >&2
                exit 1
              fi
            done
          done

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pytest
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml ruff==0.12.10

      - name: Ratchet Python function complexity
        run: python -m ruff check .

      - name: Run setup-soldr contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            tests/test_action_target_cache_wiring.py \
            tests/test_bench_cache_modes_workflow.py \
            tests/test_cook_rematerialization_workflow.py \
            tests/test_rust_ci_workflow.py \
            tests/test_release_rollout_contract.py \
            tests/test_v0_promotion_evidence.py \
            tests/test_release_lane_workflow.py

  release-readiness:
    name: Default Release Readiness
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify the action default is published and complete
        # The script sends `Authorization: Bearer $GITHUB_TOKEN` when the
        # variable is set. Without it the releases lookup is an anonymous
        # call against the shared per-IP rate limit and fails with HTTP 403
        # on busy runners (2026-09-04, run 33914038321, green on rerun).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-default-release-readiness.mjs

  wheel-fallback-smoke:
    name: Wheel fallback smoke (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - windows-11-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - id: setup
        name: Install the default Soldr release
        uses: ./
        with:
          cache: false
          prebuild-deps: none

      - name: Verify the wheel runtime and pinned helper
        shell: pwsh
        run: |
          $versionJson = (soldr version --json | Out-String) | ConvertFrom-Json
          $actionVersion = "${{ steps.setup.outputs.soldr-version }}"
          if ($versionJson.soldr_version -ne $actionVersion) {
            throw "soldr version mismatch: binary=$($versionJson.soldr_version), action=$actionVersion"
          }

          $cargoChefVersion = (cargo-chef --version | Out-String).Trim()
          if ($cargoChefVersion -ne "cargo-chef 0.1.73") {
            throw "unexpected cargo-chef version: $cargoChefVersion"
          }

          $daemonHelp = soldr-daemon --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $daemonHelp -notmatch "Long-lived companion to soldr") {
            throw "soldr-daemon multicall alias did not execute"
          }

          $doctorJson = (soldr doctor --json | Out-String) | ConvertFrom-Json
          if ($doctorJson.zccache.backend -ne "embedded") {
            throw "expected embedded zccache; got $($doctorJson.zccache | ConvertTo-Json -Compress)"
          }

  # GEN-022 (forge-ci/ci.yml#405): every merge-queue run ends with the ci-lint
  # cache janitor. It runs after every other job, even failed ones, so the
  # repository stays under [cache].budget by our LRU order instead of GitHub's.
  # The non-cancelling `cache-janitor` group keeps one sweep at a time.
  queue-cache-janitor:
    name: End-of-queue cache janitor
    needs: [cancel-superseded, js-build, contract-tests, release-readiness, wheel-fallback-smoke]
    if: always() && github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: cache-janitor
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      # The janitor reads only ci.toml from this repository.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          sparse-checkout: ci.toml
          sparse-checkout-cone-mode: false
      # Same commit as ci.toml's `linter` pin.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: forge-ci/ci.yml
          ref: 953c4e13691b10c1c4f1f9c39fa259fd732c5789
          path: .ci-lint
          persist-credentials: false
          sparse-checkout: ci_lint
      - name: Sweep caches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: .ci-lint
        run: python3 -P -m ci_lint cache janitor --repo . --default-branch main
