name: Update v0 tag

# Manual promotion only. A successful local contract cannot move v0 until a
# downstream run proves it executed this action at the exact candidate SHA.

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full current main SHA to promote.
        required: true
        type: string
      canary_run_id:
        description: FastLED/fbuild exact-pin ci-minimal run ID (superseded duplicates resolved).
        required: true
        type: string
      dry_run:
        description: Report evidence and refs without moving v0.
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: update-v0-tag
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Verify exact-main contract and downstream canary
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
          CANARY_RUN_ID: ${{ inputs.canary_run_id }}
        run: python3 scripts/verify-v0-promotion.py

      - name: Verify the default release is ready
        run: node scripts/check-default-release-readiness.mjs

      - name: Smoke-install the default release from this checkout
        uses: ./
        with:
          cache: false
          prebuild-deps: none

      - name: Report decision and compare-and-swap v0
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          CANARY_RUN_ID: ${{ inputs.canary_run_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          old_ref="$(git ls-remote origin refs/tags/v0 | cut -f1)"
          test "${old_ref}" != ""
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "${TARGET_SHA}"
          echo "Contract: https://github.com/zackees/setup-soldr/actions/runs/$(cat "$RUNNER_TEMP/v0-contract-run-id")"
          echo "Canary: https://github.com/FastLED/fbuild/actions/runs/$(cat "$RUNNER_TEMP/v0-canary-run-id")"
          echo "Decision: v0 ${old_ref} -> ${TARGET_SHA}; dry_run=${DRY_RUN}"
          if [[ "${DRY_RUN}" == "true" ]]; then exit 0; fi
          git push --force-with-lease="refs/tags/v0:${old_ref}" origin "${TARGET_SHA}:refs/tags/v0"
          test "$(git ls-remote origin refs/tags/v0 | cut -f1)" = "${TARGET_SHA}"
